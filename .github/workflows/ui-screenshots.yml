name: Boruzi Android UI Screenshots

on:
  push:
    branches:
      - 'audit/boruzi-android-screenshots-*'
    paths:
      - '.github/workflows/ui-screenshots.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boruzi-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-screenshots:
    name: Real Android Emulator UI Audit
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      ADB_INSTALL_TIMEOUT: "12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate pipe data and assemble test APK
        run: |
          python3 tools/verify_pipe_data.py
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Install UI audit driver (temporary runner file, not repository source)
        run: |
          cat > "$RUNNER_TEMP/boruzi_visual.py" <<'PYTHON'
          import json
          import os
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "ui-screenshots"
          root.mkdir(exist_ok=True)
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          pkg = "com.avenox.pipedata"
          outcomes = []
          errors = []

          def adb(*args, check=True, timeout=50):
              p = subprocess.run(["adb", *map(str,args)], text=True,
                                 capture_output=True, timeout=timeout)
              if check and p.returncode:
                  raise RuntimeError(f"adb {args}: {p.stderr[-500:]} {p.stdout[-500:]}")
              return p.stdout

          def hierarchy(tag):
              # UI hierarchy comes from the running Android accessibility tree.
              adb("shell", "uiautomator", "dump", "/sdcard/boruzi-ui.xml", timeout=90)
              target = root / f"{tag}.xml"
              subprocess.run(["adb", "pull", "/sdcard/boruzi-ui.xml", str(target)],
                             check=True, capture_output=True, timeout=40)
              return list(ET.parse(target).iter("node"))

          def center(bounds):
              m = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
              if not m:
                  raise ValueError(f"Invalid bounds: {bounds}")
              a,b,c,d = map(int, m.groups())
              return ((a+c)//2,(b+d)//2)

          def tap_node(label, tag, mode="either", nth=0):
              nodes = hierarchy(tag)
              # Prefer semantic content descriptions over ambiguous visible labels.
              key_order = ["content-desc","text"] if mode == "either" else [mode]
              for key in key_order:
                  found = [n for n in nodes if n.attrib.get(key,"") == label
                           and n.attrib.get("bounds")]
                  if len(found)>nth:
                      x,y=center(found[nth].attrib["bounds"])
                      adb("shell", "input", "tap", x, y)
                      time.sleep(.7)
                      return
              raise AssertionError(f"{tag}: missing Android UI node {label!r} ({mode})")

          def shot(tag):
              path = root / f"{tag}.png"
              with path.open("wb") as f:
                  p = subprocess.run(["adb","exec-out","screencap","-p"],
                                     stdout=f,stderr=subprocess.PIPE,timeout=40)
                  if p.returncode: raise RuntimeError(p.stderr.decode(errors="replace"))
              if path.stat().st_size < 1500 or path.read_bytes()[:8] != b"\x89PNG\r\n\x1a\n":
                  raise AssertionError(f"Invalid screenshot PNG: {path}")
              hierarchy(tag)
              outcomes.append({"case":tag,"png":str(path.relative_to(root)),
                               "bytes":path.stat().st_size})
              print(f"CAPTURED {tag} {path.stat().st_size} bytes",flush=True)

          def exercise(width, font, metric):
              tag=f"w{width}_f{str(font).replace('.','p')}_{'mm' if metric else 'inch'}"
              adb("shell","wm","size",f"{width}x740")
              adb("shell","wm","density","160")
              adb("shell","settings","put","system","font_scale",str(font))
              # Each test starts with clean preferences and default imperial mode.
              adb("shell","pm","clear",pkg)
              adb("shell","am","start","-W","-n",f"{pkg}/.MainActivity",timeout=90)
              time.sleep(2)
              shot(tag+"_boru")
              tap_node("Ayarlar",tag+"_nav_settings","content-desc")
              shot(tag+"_ayarlar")
              if metric:
                  switches=[n for n in hierarchy(tag+"_settings_switches")
                            if n.attrib.get("class") in ("android.widget.Switch",
                                                         "android.widget.CheckBox")
                            and n.attrib.get("bounds")]
                  if len(switches) < 2:
                      raise AssertionError(f"Expected two settings switches: got {len(switches)}")
                  x,y=center(switches[1].attrib["bounds"])
                  adb("shell","input","tap",x,y)
                  time.sleep(.5)
                  shot(tag+"_ayarlar_mm")
              tap_node("Boru",tag+"_nav_boru","content-desc")
              shot(tag+"_boru_selected")
              # Numerical selection dialog must open, have a field and close.
              tap_node("İç Çap (ID)",tag+"_open_od","text")
              shot(tag+"_od_dialog")
              tap_node("İptal",tag+"_dismiss_od","text")
              # SCH page: both field entry and result button are exercised.
              tap_node("SCH Bul",tag+"_nav_lookup","content-desc")
              shot(tag+"_sch_bul")
              tap_node("Dış çap (inç)" if not metric else "Dış çap (mm)",
                       tag+"_lookup_field","text")
              shot(tag+"_numeric_keyboard")
              adb("shell","input","keyevent","4")
              # Text button is distinct from semantic bottom navigation.
              tap_node("SCH Bul",tag+"_lookup_submit","text",nth=1)
              shot(tag+"_sch_results")
              tap_node("Tablo/Standart",tag+"_nav_table","content-desc")
              shot(tag+"_tablo_standart")
              # Scroll verifies long content and bottom navigation stability.
              adb("shell","input","swipe",width//2,620,width//2,205,430)
              time.sleep(.5)
              shot(tag+"_tablo_scrolled")
              tap_node("Ayarlar",tag+"_nav_final_settings","content-desc")
              shot(tag+"_ayarlar_final")

          def main():
              print("EMULATOR",adb("shell","getprop","ro.build.version.release").strip())
              print("ABI",adb("shell","getprop","ro.product.cpu.abi").strip())
              adb("install","-r",apk,timeout=180)
              for width in (320,360,411):
                  for font in (1.0,1.3):
                      for metric in (False,True):
                          label=f"{width}dp,font={font},metric={metric}"
                          try:
                              exercise(width,font,metric)
                              print("PASS",label,flush=True)
                          except Exception as exc:
                              errors.append({"case":label,"error":repr(exc)})
                              print("FAIL",label,repr(exc),flush=True)
                              try:
                                  shot(f"FAILED_w{width}_f{font}_{int(metric)}")
                              except Exception as shot_exc:
                                  print("FAIL_CAPTURE",repr(shot_exc),flush=True)
              (root/"results.json").write_text(
                  json.dumps({"captures":outcomes,"errors":errors},indent=2,ensure_ascii=False))
              print("SUMMARY",len(outcomes),"PNG",len(errors),"failed cases",flush=True)
              if errors: raise SystemExit(1)

          if __name__=="__main__": main()
          PYTHON
          python3 -m py_compile "$RUNNER_TEMP/boruzi_visual.py"
      - name: Boot emulator, exercise UI and capture real PNGs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_4
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 "$RUNNER_TEMP/boruzi_visual.py"
      - name: Archive emulator logs
        if: always()
        run: |
          mkdir -p ui-screenshots
          adb logcat -d -t 1500 > ui-screenshots/emulator-logcat.txt 2>&1 || true
          printf '%s\n' "run_id=${{ github.run_id }}" "commit=${{ github.sha }}" > ui-screenshots/run-metadata.txt
      - name: Upload real screenshots, hierarchy, and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boruzi-real-android-ui-${{ github.run_id }}
          path: ui-screenshots/
          if-no-files-found: error
          retention-days: 30
