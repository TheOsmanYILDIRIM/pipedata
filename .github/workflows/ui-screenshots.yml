name: Boruzi Android UI Screenshots

on:
  push:
    branches: ['audit/boruzi-android-screenshots-*']
    paths: ['.github/workflows/ui-screenshots.yml']
  workflow_dispatch:
    inputs:
      matrix:
        description: 'quick: 3 representative configs, full: 12 configs'
        type: choice
        options: [quick, full]
        default: quick

permissions:
  contents: read

concurrency:
  group: boruzi-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-screenshots:
    name: Android screenshot smoke (${{ inputs.matrix || 'quick' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUDIT_MATRIX: ${{ inputs.matrix || 'quick' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and validate catalog
        run: |
          python3 tools/verify_pipe_data.py
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --console=plain
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare short-lived UI test script
        run: |
          cat > "$RUNNER_TEMP/boruzi_quick.py" <<'PY'
          import json
          import os
          import re
          import subprocess
          import time
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "ui-screenshots"
          root.mkdir(exist_ok=True)
          apk = "app/build/outputs/apk/debug/app-debug.apk"
          pkg = "com.avenox.pipedata"
          passed, problems = [], []

          def adb(*args, timeout=25):
              p = subprocess.run(["adb", *map(str, args)], capture_output=True,
                                 timeout=timeout)
              if p.returncode:
                  raise RuntimeError("adb " + " ".join(map(str,args)) +
                                     ": " + p.stderr.decode(errors="replace")[-300:])
              return p.stdout

          def nodes(tag):
              adb("shell", "uiautomator", "dump", "/sdcard/boruzi.xml", timeout=25)
              p = root / (tag + ".xml")
              p.write_bytes(adb("exec-out", "cat", "/sdcard/boruzi.xml"))
              return list(ET.fromstring(p.read_bytes()).iter("node"))

          def center(bounds):
              m = re.fullmatch(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", bounds)
              if not m:
                  raise AssertionError("Bad bounds: " + str(bounds))
              a,b,c,d = map(int,m.groups())
              return (a+c)//2, (b+d)//2

          def tap_text(items, label, attr="text"):
              for item in items:
                  if item.attrib.get(attr) == label and item.attrib.get("bounds"):
                      x,y = center(item.attrib["bounds"])
                      adb("shell","input","tap",x,y)
                      return True
              return False

          def png(tag):
              p = root / (tag + ".png")
              p.write_bytes(adb("exec-out","screencap","-p"))
              data = p.read_bytes()
              if not data.startswith(b"\x89PNG\r\n\x1a\n") or len(data)<1500:
                  raise AssertionError("PNG invalid: "+tag)
              passed.append({"name":tag,"bytes":len(data)})
              print("CAPTURE",tag,len(data),flush=True)

          def check(tag, operation):
              try:
                  operation()
                  print("PASS",tag,flush=True)
              except Exception as exc:
                  print("FAIL",tag,repr(exc),flush=True)
                  problems.append({"case":tag,"error":repr(exc)})

          def exercise(width, scale, metric):
              tag=f"{width}dp_font{scale}_{'mm' if metric else 'inch'}".replace(".","p")
              adb("shell","wm","size",f"{width}x740")
              adb("shell","wm","density","160")
              adb("shell","settings","put","system","font_scale",str(scale))
              adb("shell","am","force-stop",pkg)
              adb("shell","am","start","-n",pkg+"/.MainActivity")
              time.sleep(1)
              if metric:
                  items = nodes(tag+"_unit")
                  if not tap_text(items,"mm"):
                      raise AssertionError("Boru metric switch not found")
                  time.sleep(.2)
              png(tag+"_boru")
              initial = nodes(tag+"_boru")
              # Reuse bottom navigation coordinates: no expensive XML dump per click.
              nav = ["SCH Bul","Tablo/Standart","Ayarlar","Boru"]
              coords = {}
              for name in nav:
                  found=[n for n in initial if n.attrib.get("content-desc")==name]
                  if not found:
                      raise AssertionError("Missing bottom navigation semantics: "+name)
                  coords[name]=center(found[0].attrib["bounds"])
              for name in nav:
                  adb("shell","input","tap",*coords[name])
                  time.sleep(.18)
                  png(tag+"_"+name.lower().replace("/","_").replace(" ","_"))
              # Exercise at least one real Android dialog and a SCH field/keyboard.
              dialog_nodes = nodes(tag+"_dialog_source")
              if tap_text(dialog_nodes,"İç Çap (ID)"):
                  time.sleep(.2)
                  png(tag+"_id_dialog")
                  adb("shell","input","keyevent","4")
              else:
                  problems.append({"case":tag,"error":"ID edit label not exposed in UI hierarchy"})
              adb("shell","input","tap",*coords["SCH Bul"])
              lookup_nodes = nodes(tag+"_lookup_source")
              wanted="Dış çap (mm)" if metric else "Dış çap (inç)"
              if tap_text(lookup_nodes,wanted):
                  time.sleep(.15)
                  png(tag+"_keyboard")
                  adb("shell","input","keyevent","4")
              else:
                  problems.append({"case":tag,"error":"SCH lookup input label not exposed: "+wanted})
              # Change NPS with accessibility click and record difference for long values.
              adb("shell","input","tap",*coords["Boru"])
              dial_nodes=nodes(tag+"_dial_source")
              dial=next((n for n in dial_nodes if n.attrib.get("content-desc","").startswith("Döner NPS sayacı")),None)
              if dial:
                  x,y=center(dial.attrib["bounds"])
                  adb("shell","input","tap",x,y)
                  time.sleep(.15)
                  png(tag+"_nps_changed")
              else:
                  problems.append({"case":tag,"error":"NPS dial semantics missing"})

          def main():
              try:
                  print("EMULATOR",adb("shell","getprop","ro.build.version.release").decode().strip(),flush=True)
                  adb("install","-r",apk,timeout=75)
                  mode=os.environ.get("AUDIT_MATRIX","quick")
                  cases=([(360,1.0,False),(320,1.3,True),(411,1.0,True)]
                         if mode=="quick" else
                         [(w,f,m) for w in (320,360,411) for f in (1.0,1.3) for m in (False,True)])
                  for w,f,m in cases:
                      check(f"{w}dp_{f}_{m}",lambda w=w,f=f,m=m: exercise(w,f,m))
              finally:
                  (root/"results.json").write_text(json.dumps(
                      {"capture_count":len(passed),"captures":passed,"errors":problems},
                      indent=2,ensure_ascii=False))
              print("SUMMARY",len(passed),"PNG",len(problems),"errors",flush=True)
              if problems or not passed: raise SystemExit(1)

          if __name__ == "__main__":
              main()
          PY
          python3 -m py_compile "$RUNNER_TEMP/boruzi_quick.py"
      - name: Boot one emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: default
          profile: pixel_4
          disable-animations: true
          emulator-boot-timeout: 180
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 "$RUNNER_TEMP/boruzi_quick.py"
      - name: Record run evidence
        if: always()
        run: |
          mkdir -p ui-screenshots
          echo "run_id=${{ github.run_id }}" > ui-screenshots/run-metadata.txt
          echo "commit=${{ github.sha }}" >> ui-screenshots/run-metadata.txt
      - name: Upload PNG, accessibility XML and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boruzi-ui-quick-${{ github.run_id }}
          path: ui-screenshots/
          if-no-files-found: error
          retention-days: 14
