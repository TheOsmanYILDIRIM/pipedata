name: Pipe Calculator Android CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: boru-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Validate Data and Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify independent pipe data
        run: python tools/verify_pipe_data.py
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Restore release signing key
        env:
          SIGNING_BASE64: ${{ secrets.BORUZI_RELEASE_KEYSTORE_B64 }}
        run: |
          test -n "$SIGNING_BASE64" || { echo "::error::Configure BORUZI_RELEASE_KEYSTORE_B64 secret before merging"; exit 1; }
          printf '%s' "$SIGNING_BASE64" | base64 -d > "$RUNNER_TEMP/boruzi-release.keystore"
          test -s "$RUNNER_TEMP/boruzi-release.keystore"
      - name: Compile release APK only
        env:
          BORUZI_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/boruzi-release.keystore
          BORUZI_RELEASE_STORE_PASSWORD: ${{ secrets.BORUZI_RELEASE_STORE_PASSWORD }}
          BORUZI_RELEASE_KEY_ALIAS: ${{ secrets.BORUZI_RELEASE_KEY_ALIAS }}
          BORUZI_RELEASE_KEY_PASSWORD: ${{ secrets.BORUZI_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$BORUZI_RELEASE_STORE_PASSWORD" && test -n "$BORUZI_RELEASE_KEY_ALIAS" && test -n "$BORUZI_RELEASE_KEY_PASSWORD"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Check APK output
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          ls -lh app/build/outputs/apk/release/app-release.apk
      - name: Clean temporary signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/boruzi-release.keystore"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: boru-hesaplayici-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30
