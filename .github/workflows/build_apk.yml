name: Build Android Jetpack Compose APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Verify Canonical CSV <-> DB Reconciliation (CSV-First Gate)
        run: |
          python3 build_canonical_csv.py --app-only
          python3 csv_vs_db_audit.py --fail-on-diff
          echo "==> Kanonik CSV, pipedata.db ile 0 fark (app CSV'den okuyacak)"

      - name: Build Signed APKs with Gradle
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Verify APK Output
        run: |
          ls -lh app/build/outputs/apk/release/ app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/release/app-release.apk || exit 1
          test -f app/build/outputs/apk/debug/app-debug.apk || exit 1

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pipedata-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release & Publish APK
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-compose
          name: "Pipedata v1.0.1 - Performance & Preference Persistence Update"
          body: |
            ## Pipedata Native Android Jetpack Compose Release (v1.0.1)

            ### ✨ What's New
            - **Lightning Fast Navigation**: Pre-warmed SQLite caching and zero-I/O in-memory SVG asset caching for instantaneous category and screen transitions.
            - **Full Preference Persistence**: All user settings, active unit system, theme, language, font scale, and per-category component selections (NPS, Class, Schedule, Rating, Facing) are automatically saved and restored across app restarts.
            - **Default Imperial (Inch) Units**: Default unit system is now Imperial (in / lb), with live instant toggle buttons accessible directly on top bars across all screens.
            - **Dynamic Responsive SVG Dimension Labels**: Numbers scale smoothly with font scale preferences while maintaining strict padding and translucent badge backgrounds that never overlap or obstruct CAD technical drawings.
            - **Fixed Keystore Signing**: Consistent, immutable keystore signing (`antigravity.keystore`) ensuring seamless in-place APK updates without signature mismatch errors.
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
