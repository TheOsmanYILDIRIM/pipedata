<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" class="pipedata-svg">
  <defs>
    <!-- ASME/ANSI 31 Standard 45-degree Cross-Hatch Pattern -->
    <pattern id="metalHatch" width="10" height="10" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.2" opacity="0.35" />
    </pattern>

    <!-- Standard Engineering Dimension Arrows -->
    <marker id="arrowStart" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 10 2 L 0 5 L 10 8 Z" fill="currentColor" />
    </marker>
    <marker id="arrowEnd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 10 5 L 0 8 Z" fill="currentColor" />
    </marker>
  </defs>

  <style>
    .pipedata-svg { color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .centerline { stroke: #38bdf8; stroke-width: 1; stroke-dasharray: 14, 4, 3, 4; opacity: 0.5; }
    .pipe-wall { fill: url(#metalHatch); stroke: currentColor; stroke-width: 2.2; stroke-linejoin: round; }
    .dim-line { stroke: currentColor; stroke-width: 1.2; }
    .ext-line { stroke: currentColor; stroke-width: 0.9; opacity: 0.6; }
    .dim-pill { fill: #1e293b; stroke: #334155; stroke-width: 1; rx: 4; }
    .dim-text { fill: #38bdf8; font-weight: 700; font-size: 15px; text-anchor: middle; dominant-baseline: central; font-family: monospace; }
  </style>

  <!-- 1. CENTERLINES (ASME Y14.5M) -->
  <g class="layer-centerlines">
    <line x1="80" y1="300" x2="520" y2="300" class="centerline" />
    <line x1="300" y1="80" x2="300" y2="520" class="centerline" />
  </g>

  <!-- 2. PIPE SOLID BODY WITH CLEAN DONUT MASK (No polyline spaghetti) -->
  <g class="layer-body">
    <!-- Outer R: 140, Inner R: 115 (Center: 300, 300) -->
    <path class="pipe-wall" fill-rule="evenodd"
          d="M 300 160
             A 140 140 0 1 0 300 440
             A 140 140 0 1 0 300 160
             Z
             M 300 185
             A 115 115 0 1 1 300 415
             A 115 115 0 1 1 300 185
             Z" />
  </g>

  <!-- 3. DIMENSIONS & LABELS -->
  <g class="layer-dimensions">
    <!-- Top: Outer Diameter (OD) [[3]] -->
    <line x1="160" y1="120" x2="160" y2="290" class="ext-line" />
    <line x1="440" y1="120" x2="440" y2="290" class="ext-line" />
    <line x1="160" y1="130" x2="440" y2="130" class="dim-line" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
    <rect x="250" y="118" width="100" height="24" class="dim-pill" />
    <text x="300" y="130" class="dim-text">[[3]]</text>

    <!-- Bottom: Inner Diameter (ID) [[6]] -->
    <line x1="185" y1="310" x2="185" y2="480" class="ext-line" />
    <line x1="415" y1="310" x2="415" y2="480" class="ext-line" />
    <line x1="185" y1="470" x2="415" y2="470" class="dim-line" marker-start="url(#arrowStart)" marker-end="url(#arrowEnd)" />
    <rect x="250" y="458" width="100" height="24" class="dim-pill" />
    <text x="300" y="470" class="dim-text">[[6]]</text>

    <!-- Right: Half OD / Radius [[5]] -->
    <line x1="300" y1="300" x2="440" y2="300" class="dim-line" marker-end="url(#arrowEnd)" />
    <line x1="440" y1="300" x2="550" y2="300" class="dim-line" />
    <rect x="470" y="288" width="70" height="24" class="dim-pill" />
    <text x="505" y="300" class="dim-text">[[5]]</text>

    <!-- Top-Left Leader: Wall Thickness (WT) [[4]] -->
    <line x1="210" y1="210" x2="215" y2="215" class="dim-line" marker-start="url(#arrowStart)" />
    <line x1="140" y1="160" x2="210" y2="210" class="dim-line" />
    <line x1="70" y1="160" x2="140" y2="160" class="dim-line" />
    <rect x="70" y="148" width="80" height="24" class="dim-pill" />
    <text x="110" y="160" class="dim-text">[[4]]</text>
  </g>
</svg>